name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint rich

      - name: Analysing the code with pylint (limit to project files)
        run: |
          # Only lint package code and examples/tests to reduce runtime
          FILES=$(git ls-files | grep -E '^(src/|examples/|tests/).+\.py$' || true)
          if [ -z "$FILES" ]; then
            echo "No files to lint."
            exit 0
          fi

          # Run pylint and propagate exit code
          pylint $FILES --fail-under=8.0
