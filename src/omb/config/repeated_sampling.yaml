# DashScope API Configuration
DASHSCOPE_API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
DASHSCOPE_API_KEY: ""  # Set via DASHSCOPE_API_KEY environment variable

# Hunyuan API Configuration
HUNYUAN_API_BASE: "https://api.hunyuan.cloud.tencent.com/v1/chat/completions"
HUNYUAN_API_KEY: ""  # Set via HUNYUAN_API_KEY environment variable

# API Request Parameters
MAX_TOKENS: 128000
#MAX_TOKENS: 32768
#MAX_TOKENS: 65536
TIMEOUT: 600  # seconds
SAMPLE_K: 128  # Number of independent responses to sample per generator model per question
REPEATED_JUDGE: 1  # Number of repeated judge runs per (model_response, judge_model) pair
RETRY_TIMES: 16
RETRY_DELAY: 10  # seconds
MAX_GENERATION_CONCURRENCY: 1024
MAX_GRADING_CONCURRENCY: 1024

# Sampling Parameters (set to null to disable)
TEMPERATURE: 1.0
TOP_P: 0.95  # Nucleus sampling (0.0-1.0) - widely used default for good balance
TOP_K: 20  # Top-k sampling (integer) - usually not needed when top_p is set
MIN_P: null  # Minimum probability threshold (0.0-1.0) - advanced parameter, rarely needed
FREQUENCY_PENALTY: null  # Penalize frequent tokens (-2.0 to 2.0) - 0.0 = no penalty
PRESENCE_PENALTY: null  # Penalize present tokens (-2.0 to 2.0) - 0.0 = no penalty
REPETITION_PENALTY: null  # Repetition penalty (>0.0) - 1.0 = no penalty (for models that support it)

# Proxy Configuration
PROXY: null  # Set to proxy URL if needed

